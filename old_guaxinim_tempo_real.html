<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Guaxinim Tempo Real</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Outfit', sans-serif;
    }

    canvas#gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      transition: filter 0.5s ease;
    }

    /* UI Styles */
    #ui-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #ui-toggle:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1) rotate(90deg);
    }

    #ui-panel {
      position: absolute;
      top: 20px;
      right: 90px;
      width: 320px;
      max-height: 90vh;
      overflow-y: auto;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 28px;
      color: #fff;
      z-index: 99;
      transform: translateX(130%);
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    #ui-panel::-webkit-scrollbar {
      width: 8px;
    }
    #ui-panel::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }

    #ui-panel.open {
      transform: translateX(0);
      opacity: 1;
      pointer-events: all;
    }

    .ui-group {
      margin-bottom: 22px;
    }

    .ui-group label.group-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #a29bfe;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .ui-group input[type="text"], 
    .ui-group select,
    .ui-group input[type="range"],
    .ui-group input[type="file"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 12px 14px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
      appearance: none;
    }

    .ui-group input[type="text"]:focus,
    .ui-group select:focus,
    .ui-group input[type="file"]:focus {
      border-color: #a29bfe;
      background: rgba(255, 255, 255, 0.12);
    }

    .ui-group select option {
      background: #1e1e2e;
      color: white;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.03);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .toggle-row label {
      margin: 0;
      color: #dfe6e9;
      font-size: 14px;
      font-weight: 400;
    }

    /* Custom Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.15);
      transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #a29bfe;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    
    .hidden {
      display: none !important;
    }
    
    .time-display {
      text-align: center;
      font-size: 36px;
      font-weight: 300;
      margin-bottom: 24px;
      color: #fff;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    /* Range slider custom styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      padding: 0;
      margin-top: 5px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #a29bfe;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 0 10px rgba(162, 155, 254, 0.5);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }

    /* File input styling */
    .ui-group input[type="file"]::file-selector-button {
      background: rgba(162, 155, 254, 0.2);
      color: #a29bfe;
      border: 1px solid rgba(162, 155, 254, 0.5);
      border-radius: 6px;
      padding: 6px 12px;
      margin-right: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Outfit', sans-serif;
      transition: background 0.3s;
    }

    .ui-group input[type="file"]::file-selector-button:hover {
      background: rgba(162, 155, 254, 0.4);
    }
  </style>
</head>
<body>

    timeSlider.addEventListener('input', (e) => { manualTimeVal = parseFloat(e.target.value); });

      'TYYYYYYYYYYYYYYYYYYT'
    ];

    const raccoonImg = new Image();
    raccoonImg.src = 'guaxinim_inteiro_transp.png';

    // combined sprite sheet: 4 columns (seasons), 2 rows (top: raccoon-inside, bottom: raccoon-outside)
    const treesSheet = new Image();
    let treesSheetLoaded = false;
    treesSheet.onload = () => {
      treesSheetLoaded = true;
      // precompute bottom pixels for each tile (4 cols x 2 rows)
      try {
        const sheetW = treesSheet.naturalWidth;
        const sheetH = treesSheet.naturalHeight;
        const tileW = sheetW / 4;
        const tileH = sheetH / 2;
        for (let col = 0; col < 4; col++) {
          for (let row = 0; row < 2; row++) {
            const key = `${col}_${row}`;
            // populate cache by calling the detector
            try { getBottomYFromRegion(treesSheet, col * tileW, row * tileH, tileW, tileH, _bottomCacheSheet, key); } catch (e) { /* ignore */ }
          }
        }
      } catch (e) {
        console.warn('Precompute bottom pixels failed for treesSheet:', e && e.message);
      }
      console.log('trees_sheet.png loaded');
    };
    treesSheet.onerror = (e) => { console.warn('Failed to load trees_sheet.png', e); };
    treesSheet.src = 'trees_sheet.png';

    // season-specific center tree images
    const treeImgs = {
      spring: new Image(),
      summer: new Image(),
      autumn: new Image(),
      winter: new Image()
    };
    treeImgs.spring.src = 'assets/spring.png';
    treeImgs.summer.src = 'assets/summer.png';
    // file provided is named "autum.png" (single n) so map autumn -> autum.png
    treeImgs.autumn.src = 'assets/autum.png';
    treeImgs.winter.src = 'assets/winter.png';

    // hole placement as fraction of image (tweak per season if needed)
    const holeFrac = { x: 0.5, y: 0.76, r: 0.11 };

    let grassBlades = [];
    function initGrass() {
      grassBlades = Array.from({ length: 300 }, () => ({
        x: Math.random() * window.innerWidth * 2,
        height: Math.random() * 15 + 5,
        width: Math.random() * 4 + 2,
        isFlower: Math.random() > 0.95
      }));
    }

    // Utilities to compute bottom-most non-transparent pixel of an image region
    const _bottomCacheSheet = {}; // key: `${col}_${row}` -> bottomY (px)
    const _bottomCacheImg = {}; // key: img.src or season -> bottomY
    const _offscreen = document.createElement('canvas');
    const _offCtx = _offscreen.getContext('2d');

    function getBottomYFromRegion(img, sx, sy, sw, sh, cache, cacheKey) {
      if (cache[cacheKey] !== undefined) return cache[cacheKey];
      // coerce integers for canvas operations
      const sxI = Math.max(0, Math.floor(sx));
      const syI = Math.max(0, Math.floor(sy));
      const w = Math.max(1, Math.floor(sw));
      const h = Math.max(1, Math.floor(sh));
      // ensure canvas size
      _offscreen.width = w;
      _offscreen.height = h;
      try {
        _offCtx.clearRect(0, 0, w, h);
        _offCtx.drawImage(img, sxI, syI, w, h, 0, 0, w, h);
        const imgData = _offCtx.getImageData(0, 0, w, h);
        const data = imgData.data;
        // determine background color by sampling corners
        function getPixelAt(ix, iy) {
          const idx = (iy * w + ix) * 4;
          return [data[idx], data[idx+1], data[idx+2], data[idx+3]];
        }
        const corners = [getPixelAt(0,0), getPixelAt(w-1,0), getPixelAt(0,h-1), getPixelAt(w-1,h-1)];
        // pick the most common corner color (naive: take top-left)
        const bg = corners[0];
        const bgR = bg[0], bgG = bg[1], bgB = bg[2], bgA = bg[3];
        const colorThreshold = 30; // color distance threshold
        for (let y = h - 1; y >= 0; y--) {
          const rowStart = y * w * 4;
          for (let x = 0; x < w; x++) {
            const base = rowStart + x * 4;
            const r = data[base];
            const g = data[base+1];
            const b = data[base+2];
            const a = data[base+3];
            const dist = Math.sqrt((r-bgR)*(r-bgR) + (g-bgG)*(g-bgG) + (b-bgB)*(b-bgB));
            if (a > 10 || dist > colorThreshold) { // non-background by alpha or color
              cache[cacheKey] = y;
              return y;
            }
          }
        }
      } catch (e) {
        // Image may be tainted/cross-origin; fall back to bottom
        console.warn('getBottomYFromRegion failed (CORS or other):', e && e.message);
      }
      cache[cacheKey] = h - 1;
      return h - 1;
    }

    const fireflies = Array.from({ length: 25 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight * 0.3 + window.innerHeight * 0.6,
      phase: Math.random() * Math.PI * 2,
      speedX: (Math.random() - 0.5) * 0.5,
      speedY: (Math.random() - 0.5) * 0.5
    }));

    const stars = Array.from({ length: 150 }, () => ({
      x: Math.random(),
      y: Math.random(),
      speed: Math.random() * 0.05,
      twinkle: Math.random() * Math.PI * 2
    }));

    const clouds = [
      { x: 10, y: 15, speed: 0.5, scale: 6 },
      { x: 50, y: 10, speed: 0.3, scale: 4 },
      { x: 80, y: 25, speed: 0.8, scale: 5 },
      { x: 20, y: 35, speed: 0.4, scale: 7 }
    ];
    
    const snowflakes = Array.from({ length: 200 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      speedY: Math.random() * 1 + 0.5,
      speedX: (Math.random() - 0.5) * 0.5,
      size: Math.random() * 3 + 1
    }));

    const shootingStars = [];
    let raccoon = { bounceOffset: 0, flip: false, frame: 0 };
    let lightningFlash = 0;

    let raccoonState = 'idle';
    let raccoonScale = 1;
    let raccoonX = window.innerWidth / 2;
    let randomHoleTime = Date.now() + Math.random() * 30000;
    // External weather fetched from APIs (geocoding + open-meteo). Null when not available.
    let externalWeather = null;
    let externalWeatherFetchedAt = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      raccoonX = canvas.width / 2;
      initGrass();
    }

    function drawSprite(sprite, startX, startY, scale, season, flip = false) {
      for (let y = 0; y < sprite.length; y++) {
        const row = sprite[y];
        for (let x = 0; x < row.length; x++) {
          const char = row[x];
          if (char === 'T') continue;
          const drawX = flip ? row.length - 1 - x : x;
          ctx.fillStyle = getColor(char, season);
          ctx.fillRect(startX + drawX * scale, startY + y * scale, scale, scale);
        }
      }
    }

    function getActiveTime() {
      if (!isAutoTime) return manualTimeVal;
      const now = new Date();
      return now.getHours() + now.getMinutes() / 60;
    }

    function getTimeTheme(h) {
      if (h >= 6 && h < 9) return 'manha';
      if (h >= 9 && h < 17) return 'dia';
      if (h >= 17 && h < 18) return 'tarde';
      return 'noite';
    }

    function getActiveSeason(date) {
      if (!isAutoSeason) return manualSeasonVal;
      const month = date.getMonth() + 1;
      if ([12, 1, 2, 3].includes(month)) return 'summer';
      if ([9, 10, 11].includes(month)) return 'spring';
      if ([6, 7, 8].includes(month)) return 'winter';
      return 'autumn';
    }

    function getActiveWeather(h, season, date) {
      if (!isAutoWeather) return manualWeatherVal;
      // Use externally fetched weather if available and recent (5 minutes)
      const nowTs = Date.now();
      if (externalWeather && (nowTs - externalWeatherFetchedAt) < (5 * 60 * 1000)) {
        return externalWeather;
      }
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const seed = Math.sin(day * 23 + month * 7 + Math.floor(h) * 17) * 10000;
      const variation = (seed - Math.floor(seed));
      
      let rainChance = 0.45;
      if (season === 'summer') rainChance = 0.75;
      if (season === 'spring') rainChance = 0.55;
      if (season === 'winter') rainChance = 0.60;

      if (h >= 12 && h < 18) {
        if (variation < rainChance) {
          if (season === 'winter') return 'snow';
          return variation < rainChance * 0.6 ? 'rain' : 'storm';
        }
        if (variation < 0.75) return 'cloudy';
        return 'clear';
      }

      if (h >= 6 && h < 12) {
        if (variation < 0.35) {
          if (season === 'winter' && variation < 0.15) return 'snow';
          return 'cloudy';
        }
        return 'clear';
      }

      if (variation < 0.4) {
        if (season === 'winter' && variation < 0.2) return 'snow';
        return 'cloudy';
      }
      return 'clear';
    }

    // --- External Weather (Geocoding + Open-Meteo) ---
    // Map open-meteo weather codes to our simplified categories
    function weatherCodeToCategory(code) {
      // see https://open-meteo.com/en/docs#api_form
      if (code === 0) return 'clear';
      if ([1,2,3,45,48].includes(code)) return 'cloudy';
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
      if ((code >= 95 && code <= 99)) return 'storm';
      if ((code >= 71 && code <= 77)) return 'snow';
      return 'cloudy';
    }

    let geocodeAbortController = null;
    let weatherAbortController = null;

    async function fetchWeatherForCity(city) {
      if (!city || city.trim().length === 0) return;
      try {
        // Abort any pending
        if (geocodeAbortController) geocodeAbortController.abort();
        geocodeAbortController = new AbortController();
        // Nominatim geocoding
        const q = encodeURIComponent(city);
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`, { signal: geocodeAbortController.signal });
        const geoJson = await geoRes.json();
        if (!geoJson || !geoJson[0]) return;
        const lat = parseFloat(geoJson[0].lat);
        const lon = parseFloat(geoJson[0].lon);

        if (weatherAbortController) weatherAbortController.abort();
        weatherAbortController = new AbortController();
        const wres = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`, { signal: weatherAbortController.signal });
        const wjson = await wres.json();
        if (wjson && wjson.current_weather && typeof wjson.current_weather.weathercode !== 'undefined') {
          externalWeather = weatherCodeToCategory(wjson.current_weather.weathercode);
          externalWeatherFetchedAt = Date.now();
        }
      } catch (e) {
        // network/abort errors -> ignore and keep externalWeather as-is
      }
    }

    // debounce input
    let cityFetchTimeout = null;
    cityInput.addEventListener('input', (e) => {
      currentCity = e.target.value;
      if (cityFetchTimeout) clearTimeout(cityFetchTimeout);
      cityFetchTimeout = setTimeout(() => fetchWeatherForCity(currentCity), 800);
    });
    // also fetch once on load for default city
    fetchWeatherForCity(currentCity);

    function drawBlockyMountain(centerX, groundY, peakHeight, baseWidth, colorShadow, colorLight, hasSnow) {
      const blockSize = 16;
      const steps = Math.max(1, Math.floor(peakHeight / blockSize));
      const stepWidth = (baseWidth / 2) / steps;

      for (let i = 0; i < steps; i++) {
        const currentY = groundY - (i * blockSize);
        const currentHalfWidth = (baseWidth / 2) - (i * stepWidth);
        const leftColor = hasSnow && i > steps * 0.65 ? '#dfe6e9' : colorShadow;
        const rightColor = hasSnow && i > steps * 0.65 ? '#ffffff' : colorLight;
        ctx.fillStyle = leftColor;
        ctx.fillRect(centerX - currentHalfWidth, currentY - blockSize, currentHalfWidth, blockSize);
        ctx.fillStyle = rightColor;
        ctx.fillRect(centerX, currentY - blockSize, currentHalfWidth, blockSize);
      }
    }

    function drawRain(groundY, intensity) {
      const dropCount = Math.floor(100 + intensity * 200);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1;
      for (let i = 0; i < dropCount; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const length = 10 + Math.random() * 15;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 4, y + length);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (let i = 0; i < 15; i++) {
        const px = Math.random() * canvas.width;
        const py = groundY + Math.random() * (canvas.height - groundY);
        const radius = 6 + Math.random() * 10;
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSnow() {
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      snowflakes.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fill();
        f.y += f.speedY;
        f.x += f.speedX;
        if (f.y > canvas.height) {
          f.y = -10;
          f.x = Math.random() * canvas.width;
        }
      });
    }

    function updateTimeDisplay(h) {
      const hours = Math.floor(h);
      const minutes = Math.floor((h - hours) * 60);
      timeDisplay.innerText = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
    }

    function drawWeatherText(weather, themeName, season) {
      const externalNote = (externalWeather && (Date.now() - externalWeatherFetchedAt) < (5 * 60 * 1000)) ? ' · live' : '';
      const label = `${currentCity} · ${season.toUpperCase()} · ${weather.toUpperCase()}${externalNote} · ${themeName.toUpperCase()}`;
      ctx.font = '16px "Outfit", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 4;
      ctx.fillText(label, 20, 35);
      ctx.shadowBlur = 0;
    }

    function loop() {
      const now = new Date();
      const h = getActiveTime();
      updateTimeDisplay(h);

      const themeName = getTimeTheme(h);
      const theme = THEMES[themeName];
      const season = getActiveSeason(now);
      const weather = getActiveWeather(h, season, now);
      
       const isNight = h >= 18 || h < 6;
       const groundY = canvas.height * 0.75;
      // approximate hole target X (will be refined after drawing the center tree image)
      let centerHoleTarget = canvas.width / 2;
      // center tree placement reference (used for fallback and offsets)
      const centerTreeX = canvas.width / 2 - 40;

      // Raccoon AI Logic
      const isUncomfortable = weather === 'rain' || weather === 'storm' || weather === 'snow';
      
      if (Date.now() > randomHoleTime && Date.now() < randomHoleTime + 15000) {
        // Hiding randomly
      } else if (Date.now() > randomHoleTime + 15000) {
        randomHoleTime = Date.now() + Math.random() * 40000 + 10000;
      }
      const isRandomlyHiding = Date.now() > randomHoleTime && Date.now() < randomHoleTime + 15000;
      const shouldHide = isUncomfortable || isRandomlyHiding;

       let targetX = canvas.width / 2;
      if (shouldHide || raccoonState === 'hiding') {
        // Always move toward the center tree when hiding
        targetX = centerHoleTarget;
      }

      const speed = canvas.width * 0.003;
      if (Math.abs(raccoonX - targetX) > speed) {
        raccoonState = 'walking';
        if (raccoonX < targetX) {
          raccoonX += speed;
          raccoon.flip = false;
        } else {
          raccoonX -= speed;
          raccoon.flip = true;
        }
        raccoonScale = 1;
      } else {
        if (shouldHide) {
          raccoonState = 'hiding';
          if (raccoonScale > 0) raccoonScale -= 0.05;
          if (raccoonScale < 0) raccoonScale = 0;
        } else {
          raccoonState = 'idle';
          if (raccoonScale < 1) raccoonScale += 0.05;
          if (raccoonScale > 1) raccoonScale = 1;
        }
      }

      // Sky
      const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.8);
      skyGradient.addColorStop(0, theme.sky1);
      skyGradient.addColorStop(0.4, theme.sky2);
      skyGradient.addColorStop(1, theme.sky3);
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (weather === 'cloudy' || weather === 'snow') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (weather === 'rain') {
        ctx.fillStyle = 'rgba(0, 0, 20, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (weather === 'storm') {
        ctx.fillStyle = 'rgba(0, 0, 30, 0.25)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (Math.random() < 0.02) lightningFlash = 8;
      }

      if (isNight) {
        stars.forEach((s) => {
          s.twinkle += s.speed;
          const opacity = (Math.sin(s.twinkle) + 1) / 2;
          ctx.fillStyle = `rgba(255,255,255,${opacity})`;
          ctx.fillRect(s.x * canvas.width, s.y * canvas.height * 0.7, 4, 4);
        });

        if (Math.random() < 0.005 && weather === 'clear') {
          shootingStars.push({
            x: Math.random() * canvas.width,
            y: 0,
            len: Math.random() * 50 + 20,
            speed: Math.random() * 5 + 10
          });
        }

        shootingStars.forEach((ss, index) => {
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(ss.x, ss.y);
          ctx.lineTo(ss.x - ss.len, ss.y - ss.len);
          ctx.stroke();
          ss.x += ss.speed;
          ss.y += ss.speed;
          if (ss.y > canvas.height) shootingStars.splice(index, 1);
        });
      }

      if (!isNight) {
        const timePercent = (h - 6) / 12;
        const sunX = canvas.width * 0.1 + canvas.width * 0.8 * timePercent;
        const sunY = canvas.height * 0.1 + Math.sin(timePercent * Math.PI) * -80;
        drawSprite(SUN, sunX, sunY, 8, season);
      } else {
        const nightH = h >= 18 ? h - 18 : h + 6;
        const timePercent = nightH / 12;
        const moonX = canvas.width * 0.1 + canvas.width * 0.8 * timePercent;
        const moonY = canvas.height * 0.15;
        drawSprite(MOON, moonX, moonY, 8, season);
      }

      if (weather !== 'rain' && weather !== 'storm' && weather !== 'snow') {
        clouds.forEach((c) => {
          c.x += c.speed;
          if (c.x > 110) c.x = -20;
          drawSprite(CLOUD, (c.x / 100) * canvas.width, (c.y / 100) * canvas.height, c.scale, season);
        });
      } else {
        const extraClouds = clouds.concat([
          { x: 35, y: 18, speed: 0.35, scale: 5 },
          { x: 70, y: 22, speed: 0.45, scale: 6 }
        ]);
        extraClouds.forEach((c) => {
          c.x += c.speed;
          if (c.x > 110) c.x = -25;
          drawSprite(CLOUD, (c.x / 100) * canvas.width, (c.y / 100) * canvas.height, c.scale, season);
        });
      }

      const mtnSnow = season === 'winter' || weather === 'snow';
      drawBlockyMountain(canvas.width * 0.25, groundY, canvas.height * 0.45, canvas.width * 0.6, theme.mountain, theme.mountainLight, mtnSnow);
      drawBlockyMountain(canvas.width * 0.75, groundY, canvas.height * 0.35, canvas.width * 0.5, theme.mountain, theme.mountainLight, mtnSnow);
      drawBlockyMountain(canvas.width * 0.5, groundY, canvas.height * 0.25, canvas.width * 0.4, theme.mountain, theme.mountainLight, season === 'winter');

      ctx.fillStyle = SEASON_COLORS[season].grass2;
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      ctx.fillStyle = SEASON_COLORS[season].grass1;
      grassBlades.forEach((b) => {
        if (b.x < canvas.width) {
          ctx.fillRect(b.x, groundY - b.height, b.width, b.height);
        }
      });
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      drawSprite(ROCK, canvas.width * 0.3, groundY - 15, 4, season);
      drawSprite(ROCK, canvas.width * 0.65, groundY - 10, 3, season);

      drawSprite(BUSH, canvas.width * 0.2, groundY - (BUSH.length * 6) + 10, 6, season);
      drawSprite(BUSH, canvas.width * 0.85, groundY - (BUSH.length * 5) + 5, 5, season);
      drawSprite(BUSH, canvas.width * 0.1, groundY - (BUSH.length * 4) + 15, 4, season);

      if (season === 'spring' || season === 'summer') {
        grassBlades.forEach((b) => {
          if (b.isFlower && b.x < canvas.width) drawSprite(FLOWER, b.x, groundY + b.height * 2, 3, season);
        });
      }

      // Draw side trees using the sprite sheet when available (bottom-row, raccoon-outside)
      if (treesSheetLoaded && treesSheet && treesSheet.naturalWidth) {
        const sheetW = treesSheet.naturalWidth;
        const sheetH = treesSheet.naturalHeight;
        const tileW = sheetW / 4;
        const tileH = sheetH / 2;
        const colMap = { winter: 0, spring: 1, summer: 2, autumn: 3 };
        const col = colMap[season] || 1;
        const row = 1; // bottom row: raccoon-outside
        const desiredSideWidth = Math.min(canvas.width * 0.12, 260);
        const sideScale = desiredSideWidth / tileW;
        const sideW = tileW * sideScale;
        const sideH = tileH * sideScale;
        // compute bottom pixel in tile to align to ground
        const bottomInTileSide = getBottomYFromRegion(treesSheet, col * tileW, row * tileH, tileW, tileH, _bottomCacheSheet, `${col}_1`);
        // left tree
        const leftX = (tree1Pct/100) * canvas.width - sideW/2;
        const leftY = groundY - bottomInTileSide * sideScale + (typeof sheetBottomNudgeValNum === 'number' ? sheetBottomNudgeValNum : 0);
        ctx.drawImage(treesSheet, col * tileW, row * tileH, tileW, tileH, leftX, leftY, sideW, sideH);
        // right tree
        const rightX = (tree2Pct/100) * canvas.width - sideW/2;
        const rightY = groundY - bottomInTileSide * sideScale + (typeof sheetBottomNudgeValNum === 'number' ? sheetBottomNudgeValNum : 0);
        ctx.drawImage(treesSheet, col * tileW, row * tileH, tileW, tileH, rightX, rightY, sideW, sideH);
      } else if (window.treeImgsSmall && window.treeImgsSmall[season] && window.treeImgsSmall[season].complete && window.treeImgsSmall[season].naturalWidth) {
        // Use small tree images if available
        const sideImg = window.treeImgsSmall[season];
        const desiredSideWidth = Math.min(canvas.width * 0.12, 260);
        const sideScale = desiredSideWidth / sideImg.naturalWidth;
        const sideW = sideImg.naturalWidth * sideScale;
        const sideH = sideImg.naturalHeight * sideScale;
        const bottom = getBottomYFromRegion(sideImg, 0, 0, sideImg.naturalWidth, sideImg.naturalHeight, _bottomCacheImg, season + '_small');
        const nudge = typeof sheetBottomNudgeValNum === 'number' ? sheetBottomNudgeValNum : 0;
        // left tree
        const leftX = (tree1Pct/100) * canvas.width - sideW/2;
        const leftY = groundY - bottom * sideScale + nudge;
        ctx.drawImage(sideImg, leftX, leftY, sideW, sideH);
        // right tree
        const rightX = (tree2Pct/100) * canvas.width - sideW/2;
        const rightY = groundY - bottom * sideScale + nudge;
        ctx.drawImage(sideImg, rightX, rightY, sideW, sideH);
      } else {
        drawSprite(TREE, (tree1Pct/100) * canvas.width, groundY - (TREE.length * 8) + 15, 8, season);
        drawSprite(TREE, (tree2Pct/100) * canvas.width, groundY - (TREE.length * 8) + 15, 8, season);
      }
      // center tree (shelter) - visually larger and centered
      // draw season image if available, otherwise fall back to blocky sprite
       const seasonKey = season === 'autumn' ? 'autumn' : season;
       const timg = treeImgs[seasonKey];
       // find if we should draw the top-row (raccoon-inside) variant from the sheet
       const shouldDrawSheetTop = shouldHide; // if raccoon intends to hide, prefer top row
       let centerTreeUsingSheetTop = false;
      // desired width scales with canvas
      const desiredWidth = Math.min(canvas.width * 0.28, 520);
      let centerTreeImgX = centerTreeX;
      let centerTreeImgY = groundY - (TREE.length * 8) + 25;
      let centerTreeImgW = 0, centerTreeImgH = 0;
      let centerHoleX = centerTreeX, centerHoleY = groundY, centerHoleR = 40;
       // Prefer using the single sprite sheet if available. The sheet layout is:
       // columns: [winter, spring, summer, autumn]
       // rows: top=with-raccoon, bottom=without-raccoon
        if (treesSheetLoaded && treesSheet && treesSheet.naturalWidth) {
         const sheetW = treesSheet.naturalWidth;
         const sheetH = treesSheet.naturalHeight;
         const tileW = sheetW / 4;
         const tileH = sheetH / 2;
         const colMap = { winter: 0, spring: 1, summer: 2, autumn: 3 };
         const col = colMap[season] || 1;
         const row = shouldDrawSheetTop ? 0 : 1;
         const natW = tileW;
         const natH = tileH;
         const scale = desiredWidth / natW;
         centerTreeImgW = natW * scale;
         centerTreeImgH = natH * scale;
        // compute bottom-most non-transparent pixel in the source tile so we can align that to groundY
        const sx = col * tileW;
        const sy = row * tileH;
        const bottomInTile = getBottomYFromRegion(treesSheet, sx, sy, tileW, tileH, _bottomCacheSheet, `${col}_${row}`);
        // bottomInTile is in pixels from top of tile. We want that pixel to sit at groundY.
        // after scaling, bottomInTile*scale should align with groundY - centerTreeImgY
        // so centerTreeImgY = groundY - bottomInTile*scale
        centerTreeImgX = canvas.width/2 - centerTreeImgW/2;
        centerTreeImgY = groundY - bottomInTile * scale + centerTreeYOffset + (typeof sheetBottomNudgeValNum === 'number' ? sheetBottomNudgeValNum : 0);
        ctx.drawImage(treesSheet, sx, sy, tileW, tileH, centerTreeImgX, centerTreeImgY, centerTreeImgW, centerTreeImgH);
        centerHoleX = centerTreeImgX + centerTreeImgW * holeFrac.x;
        centerHoleY = centerTreeImgY + centerTreeImgH * holeFrac.y;
        centerHoleR = centerTreeImgW * holeFrac.r;
        centerHoleTarget = centerHoleX;
        centerTreeUsingSheetTop = row === 0;
       } else if (timg && timg.complete && timg.naturalWidth) {
         const natW = timg.naturalWidth;
         const natH = timg.naturalHeight;
         const scale = desiredWidth / natW;
         centerTreeImgW = natW * scale;
         centerTreeImgH = natH * scale;
         // place the bottom of the image at groundY so the tree rests on the floor
         // nudge down an extra 60px total to sit perfectly on the ground for these assets
        // compute bottom-most non-transparent pixel for the full image and align to ground
        const imgBottom = getBottomYFromRegion(timg, 0, 0, timg.naturalWidth, timg.naturalHeight, _bottomCacheImg, timg.src || seasonKey);
        centerTreeImgX = canvas.width/2 - centerTreeImgW/2;
        centerTreeImgY = groundY - imgBottom * scale + centerTreeYOffset;
        ctx.drawImage(timg, centerTreeImgX, centerTreeImgY, centerTreeImgW, centerTreeImgH);
        centerHoleX = centerTreeImgX + centerTreeImgW * holeFrac.x;
        centerHoleY = centerTreeImgY + centerTreeImgH * holeFrac.y;
        centerHoleR = centerTreeImgW * holeFrac.r;
        // update movement target for this frame
        centerHoleTarget = centerHoleX;
       } else {
        // fallback to ascii tree
        drawSprite(TREE, centerTreeX, groundY - (TREE.length * 8) + 25, 9, season);
        // approximate hole position for fallback; drop fallback tree 60px as well
        const fallbackY = groundY - (TREE.length * 8) + 25 + centerTreeYOffset;
        drawSprite(TREE, centerTreeX, fallbackY, 9, season);
        centerHoleX = canvas.width/2;
        centerHoleY = fallbackY + 220;
        centerHoleTarget = centerHoleX;
        centerHoleR = 40;
      }
      
      // If raccoon is hiding in the center, draw a small badge indicator above the tree
      const hidingBadge = (raccoonState === 'hiding' && Math.abs(raccoonX - centerHoleTarget) < 160);
      if (hidingBadge) {
        const badgeX = (centerTreeImgX || (canvas.width/2 - 260/2)) + (centerTreeImgW || desiredWidth) - 48;
        const badgeY = (centerTreeImgY || (groundY - (TREE.length * 8) + 25)) + 24;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.arc(badgeX, badgeY, 18, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.font = '16px "Outfit", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('😴', badgeX, badgeY + 6);
      }

      // Debug overlay: show computed bottom alignment and hole if requested via ?debugTree=1
      const urlParams = new URLSearchParams(window.location.search);
      const debugTree = urlParams.get('debugTree') === '1';
      if (debugTree) {
        // ground line
        ctx.strokeStyle = 'rgba(255,0,0,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.stroke();
        // drawn tile bottom marker
        ctx.strokeStyle = 'rgba(0,255,0,0.9)';
        ctx.beginPath();
        ctx.moveTo(centerTreeImgX, centerTreeImgY + centerTreeImgH);
        ctx.lineTo(centerTreeImgX + centerTreeImgW, centerTreeImgY + centerTreeImgH);
        ctx.stroke();
        // hole circle
        ctx.strokeStyle = 'rgba(0,0,255,0.9)';
        ctx.beginPath();
        ctx.arc(centerHoleX, centerHoleY, Math.max(6, centerHoleR), 0, Math.PI*2);
        ctx.stroke();
        // mark computed bottom pixel (if available)
        ctx.fillStyle = 'rgba(255,255,0,0.9)';
        ctx.fillRect(centerTreeImgX + (centerTreeImgW/2) - 3, groundY - 3, 6, 6);
      }

      if (isNight) {
        const bonfireSprite = (Math.floor(Date.now() / 150) % 2 === 0) ? BONFIRE_1 : BONFIRE_2;
        drawSprite(bonfireSprite, (bonfirePct/100)*canvas.width, groundY - (BONFIRE_1.length * 6) + 15, 6, season);
        
        ctx.fillStyle = `rgba(230, 126, 34, ${(Math.sin(Date.now()/200) + 1)/8 + 0.1})`;
        ctx.beginPath();
        ctx.arc((bonfirePct/100)*canvas.width + 33, groundY - 10, 90, 0, Math.PI * 2);
        ctx.fill();

        if (weather === 'clear' && (season === 'summer' || season === 'spring')) {
          fireflies.forEach((fly) => {
            fly.x += fly.speedX;
            fly.y += fly.speedY;
            if (fly.x < 0 || fly.x > canvas.width) fly.speedX *= -1;
            if (fly.y < groundY - 50 || fly.y > canvas.height) fly.speedY *= -1;
            fly.phase += 0.05;
            const glow = (Math.sin(fly.phase) + 1) / 2;
            ctx.fillStyle = `rgba(241,196,15,${glow})`;
            ctx.beginPath();
            ctx.arc(fly.x, fly.y, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = `rgba(241,196,15,${glow * 0.3})`;
            ctx.beginPath();
            ctx.arc(fly.x, fly.y, 8, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      }

      raccoon.frame++;
      const spriteWidth = 260;
      const spriteHeight = 260;

      if (raccoonState === 'walking') {
        if (raccoon.frame % 15 === 0) raccoon.bounceOffset = raccoon.bounceOffset === 0 ? -25 : 0;
      } else {
        if (raccoon.frame % 45 === 0) {
          if (Math.random() > 0.6) raccoon.flip = !raccoon.flip;
          raccoon.bounceOffset = raccoon.bounceOffset === 0 ? -10 : 0;
        }
      }

       if (raccoonImg.complete && raccoonImg.naturalHeight !== 0 && raccoonScale > 0) {
        if (raccoonScale > 0.3) {
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath();
          ctx.ellipse(raccoonX, groundY, (raccoon.bounceOffset === 0 ? 60 : 40) * raccoonScale, 8 * raccoonScale, 0, 0, Math.PI * 2);
          ctx.fill();
        }

          // If hiding in center tree, draw raccoon inside the tree hole.
          // If we used the sheet top-row (which already contains the raccoon), do not draw the raccoon sprite again.
          const hidingAtCenter = (raccoonState === 'hiding' && Math.abs(raccoonX - centerHoleTarget) < 160);
          if (hidingAtCenter) {
            // snap raccoon to the hole target so it's visually centered
            raccoonX = centerHoleTarget;
            // If the combined sheet's top-row was used, the raccoon is already part of the drawn tree
            if (!centerTreeUsingSheetTop) {
              // draw raccoon inside the hole (only when not using sheet top-row)
              const imgW = spriteWidth * 0.6 * raccoonScale;
              const imgH = spriteHeight * 0.6 * raccoonScale;
              const cx = centerHoleX;
              const cy = centerHoleY + (imgH*0.08);
              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(-0.08);
              ctx.drawImage(raccoonImg, -imgW/2, -imgH/2, imgW, imgH);

              // draw simple closed eyes over the head area
              ctx.strokeStyle = 'rgba(20,20,20,0.95)';
              ctx.lineWidth = Math.max(2, imgW * 0.02);
              ctx.lineCap = 'round';
              // approximate eye positions relative to the raccoon image
              const eyeY = -imgH*0.12;
              const eyeLX = -imgW*0.12;
              const eyeRX = imgW*0.12;
              ctx.beginPath();
              ctx.moveTo(eyeLX - imgW*0.04, eyeY);
              ctx.quadraticCurveTo(eyeLX, eyeY + imgH*0.03, eyeLX + imgW*0.04, eyeY);
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(eyeRX - imgW*0.04, eyeY);
              ctx.quadraticCurveTo(eyeRX, eyeY + imgH*0.03, eyeRX + imgW*0.04, eyeY);
              ctx.stroke();

              // draw sleepy Zs floating upward
              ctx.fillStyle = 'rgba(255,255,255,0.9)';
              ctx.font = `${Math.max(12, Math.floor(imgW*0.08))}px "Outfit", sans-serif`;
              ctx.textAlign = 'center';
              for (let i = 0; i < 3; i++) {
                const zx = imgW*0.18 + i*imgW*0.06;
                const zy = -imgH*0.6 - i*imgH*0.12;
                ctx.globalAlpha = 1 - i*0.28;
                ctx.fillText('Z', zx, zy);
              }
              ctx.globalAlpha = 1;
              ctx.restore();
            }
          } else {
           ctx.save();
           ctx.translate(raccoonX, groundY + raccoon.bounceOffset);
           
           ctx.scale(raccoonScale, raccoonScale);
           
           if (raccoonState === 'walking') {
             if (raccoon.bounceOffset !== 0) ctx.scale(0.95, 1.05);
             else ctx.scale(1.05, 0.95);
           } else {
             if (raccoon.bounceOffset !== 0) ctx.scale(1.02, 0.98);
           }
           
           if (raccoon.flip) ctx.scale(-1, 1);
           ctx.drawImage(raccoonImg, -spriteWidth / 2, -spriteHeight + 110, spriteWidth, spriteHeight);
           ctx.restore();
         }
      }

      if (weather === 'rain' || weather === 'storm') {
        drawRain(groundY, weather === 'storm' ? 1 : 0.6);
      } else if (weather === 'snow') {
        drawSnow();
      }

      if (lightningFlash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${lightningFlash / 20})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        lightningFlash -= 1;
      }

      drawWeatherText(weather, themeName, season);
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('load', () => {
      resize();
      loop();
    });
  </script>
</body>
</html>
